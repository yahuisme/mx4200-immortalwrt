# Linksys MX4200v1 / MX4200v2 每日编译
name: MX4200 ImmortalWrt Builds

on:
  # GitHub Actions 使用 UTC；香港时间每日 17:00 = UTC 09:00
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  config:
    name: MX4200v1-v2
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: MX4200
      WRT_THEME: aurora
      WRT_NAME: MX4200
      WRT_SSID: MX4200
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: immortalwrt
      WRT_RELEASE_PREFIX: MX4200
      WRT_RELEASE_PRODUCT: ImmortalWrt

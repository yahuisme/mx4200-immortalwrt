# SPDX-License-Identifier: MIT
name: MX4200 ImmortalWrt Builds
on:
  # 香港时间每日 14:00 = UTC 06:00；源码适配不匹配时直接失败。
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      WRT_THEME: aurora
      WRT_SSID: MX4200
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
    steps:
      - uses: actions/checkout@main
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install --no-install-recommends \
            bison build-essential file flex gawk g++-multilib gcc-multilib \
            gettext libelf-dev libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev
          sudo mkdir -p /mnt/build_wrt /mnt/nss-sources
          sudo chown "$USER:$USER" /mnt/build_wrt /mnt/nss-sources
      - name: Prepare sources
        run: |
          python3 Scripts/Prepare.py --sources /mnt/nss-sources --output /mnt/build_wrt
          VERSION=$(python3 -c 'import json; print(json.load(open("/mnt/build_wrt/source-lock.json"))["official_tag"])')
          echo "WRT_RELEASE_NAME=MX4200_ImmortalWrt_${VERSION}_$(TZ=Asia/Hong_Kong date +'%y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
      - name: Restore cache
        id: downloads
        uses: actions/cache/restore@main
        with:
          path: |
            /mnt/build_wrt/dl
            /mnt/build_wrt/.ccache
          key: mx4200-build-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mx4200-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare packages
        run: |
          cd /mnt/build_wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd package
          bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"
      - name: Configure firmware
        run: |
          cd /mnt/build_wrt
          cp "$GITHUB_WORKSPACE/Config/MX4200.txt" .config
          cp -a "$GITHUB_WORKSPACE/files" .
          bash "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          make defconfig
          python3 "$GITHUB_WORKSPACE/Scripts/Verify.py" config .
      - name: Download packages
        run: make -C /mnt/build_wrt download -j"$(nproc)"
      - name: Compile firmware
        run: |
          cd /mnt/build_wrt
          export CCACHE_DIR=/mnt/build_wrt/.ccache
          export CCACHE_MAXSIZE=15G
          export CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros
          export CCACHE_NOHASHDIR=true
          export CCACHE_COMPILERCHECK=content
          make -j"$(nproc)" || make -j1 V=s
      - name: Save cache
        if: success()
        uses: actions/cache/save@main
        with:
          path: |
            /mnt/build_wrt/dl
            /mnt/build_wrt/.ccache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Verify images
        run: python3 Scripts/Verify.py images /mnt/build_wrt
      - name: Upload source lock
        uses: actions/upload-artifact@main
        with:
          name: source-lock
          path: /mnt/build_wrt/source-lock.json
          if-no-files-found: error
      - name: Release firmware
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/mnt/build_wrt/source-lock.json').read_text())
          Path('/mnt/build_wrt/release-notes.md').write_text(
              '## Linksys MX4200v1 / MX4200v2\n\n'
              '每个硬件版本各一个 factory.bin 和 sysupgrade.bin，共四个镜像。\n'
              'factory 用于原厂刷入；sysupgrade 用于已有兼容固件升级。请先检查设备与镜像，禁止强刷。\n\n'
              f'官方 ImmortalWrt {d["official_tag"]}: `{d["official_commit"]}`\n\n'
              f'LiBwrt NSS {d["donor_tag"]}: `{d["donor_commit"]}`\n\n'
              f'NSS source: `{d["nss_source"]}`\n\n'
              '采用第三方 NSS/ECM 与 ath11k 加速补丁，并非官方原版固件。\n')
          PY
          gh release create "$WRT_RELEASE_NAME" /mnt/build_wrt/upload/*.bin \
            --target "$GITHUB_SHA" --title "$WRT_RELEASE_NAME" --notes-file /mnt/build_wrt/release-notes.md
          gh release list --json tagName --jq '.[].tagName' |
            grep '^MX4200_' | grep -Fxv "$WRT_RELEASE_NAME" |
            xargs -r -n1 gh release delete --cleanup-tag -y || true

# Linksys MX4200v1 / MX4200v2 每日编译
name: MX4200 ImmortalWrt Builds

on:
  # GitHub Actions 使用 UTC；香港时间每日 14:00 = UTC 06:00
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: mx4200-build
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: MX4200v1-v2
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      WRT_THEME: aurora
      WRT_SSID: MX4200
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
    steps:
      - name: Check out build repository
        uses: actions/checkout@main

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install --no-install-recommends \
            bison build-essential ccache file flex gawk \
            g++-multilib gcc-multilib gettext libelf-dev libncurses-dev \
            libssl-dev pigz python3-setuptools rsync swig unzip zlib1g-dev
          sudo mkdir -p /mnt/build_wrt /mnt/mx4200-cache
          sudo chown "$USER:$USER" /mnt/build_wrt /mnt/mx4200-cache

      - name: Clone firmware source
        run: |
          WRT_DATE="$(TZ=Asia/Hong_Kong date +'%y.%m.%d-%H.%M.%S')"
          git clone --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" /mnt/build_wrt/
          cd /mnt/build_wrt/
          WRT_HASH=$(git rev-parse HEAD)
          WRT_REV=$(./scripts/getver.sh | sed -E 's/^r([0-9]+).*/\1/')
          {
            echo "WRT_DATE=$WRT_DATE"
            echo "WRT_RELEASE_NAME=MX4200_ImmortalWrt_${WRT_DATE}_r${WRT_REV}"
            echo "WRT_HASH=$WRT_HASH"
          } >> "$GITHUB_ENV"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Update and install feeds
        run: |
          cd /mnt/build_wrt/
          ./scripts/feeds update -a >/dev/null || { echo "::error::feeds update failed"; exit 1; }
          ./scripts/feeds install -a >/dev/null || { echo "::error::feeds install failed"; exit 1; }

      - name: Prepare custom packages
        run: |
          cd /mnt/build_wrt/package/
          bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"

      - name: Configure firmware and derive cache keys
        id: keys
        run: |
          cd /mnt/build_wrt/
          cat "$GITHUB_WORKSPACE/Config/MX4200.txt" >> .config
          echo 'CONFIG_CCACHE_DIR="/mnt/build_wrt/.ccache"' >> .config
          cp -rf "$GITHUB_WORKSPACE/files" ./
          bash "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          make defconfig -j"$(nproc)"

          cd "$GITHUB_WORKSPACE"
          python3 Scripts/Cache.py --output "$GITHUB_OUTPUT" prepare \
            --root /mnt/build_wrt --ref "$GITHUB_REF" \
            --host-id "${ImageOS}-${ImageVersion}-mx4200-env-v1"

      - name: Restore toolchain cache
        id: tools
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.keys.outputs.tc-key }}
          path: /mnt/mx4200-cache/tc.tar.gz

      - name: Restore downloads and ccache
        id: rolling
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.keys.outputs.rolling-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.keys.outputs.rolling-prefix }}
          path: /mnt/mx4200-cache/rolling.tar.gz

      - name: Unpack build caches
        run: |
          for tier in tc rolling; do
            archive="/mnt/mx4200-cache/$tier.tar.gz"
            if [ -s "$archive" ]; then
              python3 Scripts/Cache.py unpack --root /mnt/build_wrt --tier "$tier" --archive "$archive"
              rm "$archive"
            fi
          done

      - name: Download source archives
        run: |
          cd /mnt/build_wrt/
          make download -j"$(nproc)"

      - name: Compile firmware
        run: |
          cd /mnt/build_wrt/
          export CCACHE_DIR="/mnt/build_wrt/.ccache"
          export CCACHE_MAXSIZE="2G"
          export CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros
          export CCACHE_NOHASHDIR=true
          export CCACHE_COMPILERCHECK=content
          if [ ! -x staging_dir/host/bin/ccache ]; then
            make -j"$(nproc)" tools/ccache/compile
          fi
          staging_dir/host/bin/ccache -z
          # Always report this build's statistics without masking its exit status.
          trap 'status=$?; staging_dir/host/bin/ccache -s || true; exit "$status"' EXIT
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect and verify firmware images
        run: |
          cd /mnt/build_wrt/
          mkdir ./upload/
          find ./bin/targets/ -type f \( -iname '*factory*.bin' -o -iname '*sysupgrade*.bin' \) -exec mv -f {} ./upload/ \;
          IMAGE_COUNT="$(find ./upload/ -maxdepth 1 -type f -name '*.bin' | wc -l)"
          if [ "$IMAGE_COUNT" -ne 4 ]; then
            echo "::error::expected exactly 4 firmware images (v1+v2 × factory+sysupgrade), found $IMAGE_COUNT"
            exit 1
          fi
          shopt -s nullglob
          for device in mx4200v1 mx4200v2; do
            for kind in factory sysupgrade; do
              images=(./upload/*linksys_"${device}"-*"${kind}".bin)
              if [ "${#images[@]}" -ne 1 ] || [ ! -s "${images[0]}" ]; then
                echo "::error::missing, duplicate or empty $device $kind image"
                exit 1
              fi
            done
          done

      - name: Publish firmware release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_NOTES: |
            ## Linksys MX4200 系列 ImmortalWrt 固件

            本 Release 仅包含以下设备的刷机镜像：
            - Linksys MX4200v1：`factory.bin` / `sysupgrade.bin`
            - Linksys MX4200v2：`factory.bin` / `sysupgrade.bin`

            `factory.bin` 用于从原厂固件刷入；`sysupgrade.bin` 用于从已有 ImmortalWrt 升级。

            基于开源 NSS 加速栈构建。
        run: |
          gh release create "$WRT_RELEASE_NAME" /mnt/build_wrt/upload/*.bin \
            --target "$GITHUB_SHA" --title "$WRT_RELEASE_NAME" --notes "$RELEASE_NOTES"
          gh release list --json tagName --jq '.[].tagName' |
            grep '^MX4200_' |
            grep -Fxv "$WRT_RELEASE_NAME" |
            xargs -r -n1 gh release delete --cleanup-tag -y || true

      - name: Pack toolchain cache
        id: pack-tc
        if: success() && github.ref == 'refs/heads/main' && steps.tools.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.keys.outputs.tc-key }}
        run: |
          python3 Scripts/Cache.py pack --root /mnt/build_wrt --tier tc --archive /mnt/mx4200-cache/tc.tar.gz
          python3 Scripts/Cache.py --output "$GITHUB_OUTPUT" admit \
            --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" \
            --archive /mnt/mx4200-cache/tc.tar.gz

      - name: Save toolchain cache
        id: save-tc
        if: success() && steps.pack-tc.outputs.admitted == 'true'
        uses: actions/cache/save@main
        continue-on-error: true
        with:
          key: ${{ steps.keys.outputs.tc-key }}
          path: /mnt/mx4200-cache/tc.tar.gz

      - name: Prune obsolete toolchain caches
        if: success() && steps.save-tc.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.keys.outputs.tc-key }}
        run: |
          python3 Scripts/Cache.py prune --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" --delete

      - name: Pack downloads and ccache
        id: pack-rolling
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.rolling.outputs.cache-primary-key }}
        run: |
          python3 Scripts/Cache.py pack --root /mnt/build_wrt --tier rolling --archive /mnt/mx4200-cache/rolling.tar.gz
          python3 Scripts/Cache.py --output "$GITHUB_OUTPUT" admit \
            --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" \
            --archive /mnt/mx4200-cache/rolling.tar.gz

      - name: Save downloads and ccache
        id: save-rolling
        if: success() && steps.pack-rolling.outputs.admitted == 'true'
        uses: actions/cache/save@main
        continue-on-error: true
        with:
          key: ${{ steps.rolling.outputs.cache-primary-key }}
          path: /mnt/mx4200-cache/rolling.tar.gz

      - name: Prune obsolete downloads and ccache
        if: success() && steps.save-rolling.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_KEY: ${{ steps.rolling.outputs.cache-primary-key }}
        run: |
          python3 Scripts/Cache.py prune --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" --delete

name: MX4200 ImmortalWrt Builds

on:
  workflow_dispatch:

  # Daily check at 12:00 Hong Kong time (04:00 UTC); build every three days.
  schedule:
    - cron: '0 4 * * *'
concurrency:
  group: mx4200-build
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  schedule:
    name: Check build schedule
    runs-on: ubuntu-24.04-arm
    permissions: {}
    outputs:
      build: ${{ steps.due.outputs.build }}
    steps:
    - name: Check three-day interval
      id: due
      run: |
        python3 - <<'PY'
        from datetime import date, datetime
        from pathlib import Path
        from zoneinfo import ZoneInfo
        import os

        today = datetime.now(ZoneInfo('Asia/Hong_Kong')).date()
        anchor = date(2026, 10, 29)
        due = (today - anchor).days
        build = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or (due >= 0 and due % 3 == 0)
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write(f'build={str(build).lower()}\n')
        PY

  build:
    needs: schedule
    if: needs.schedule.outputs.build == 'true'
    name: MX4200 Build firmware
    runs-on: ubuntu-24.04-arm
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/default
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    # Rolling caches contain no staging or build stamps.
    - name: Restore compiler cache
      id: gh
      uses: actions/cache/restore@v6
      with: {path: ccarchive, key: 'cc-v1-mx4200-arm64.${{ github.run_id }}.${{ github.run_attempt }}', restore-keys: 'cc-v1-mx4200-arm64.'}
    - name: Restore download cache
      id: dl
      uses: actions/cache/restore@v6
      with: {path: dlarchive, key: 'dl-v1-mx4200-arm64.${{ github.run_id }}.${{ github.run_attempt }}', restore-keys: 'dl-v1-mx4200-arm64.'}
    - name: Prepare build environment
      run: |
        mkdir -p build-record openwrt_bin ghcache dlcache tcarchive ccarchive dlarchive tbarchive
        if [ -f ccarchive/ccache.tar.gz ]; then tar --gzip -xf ccarchive/ccache.tar.gz -C ghcache; fi
        if [ -f dlarchive/dl.tar.gz ]; then tar --gzip -xf dlarchive/dl.tar.gz -C dlcache; fi
        sudo python3 scripts/dlcache.py snapshot dlcache "$RUNNER_TEMP/dlcache-before.json"
        [ -f "user/default/config.diff" ] || { echo "::error::config.diff not found"; exit 1; }
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=mx4200-builder:local
        docker build --platform linux/arm64 -t "$IMAGE" docker
        IMAGE_ID=$(docker image inspect --format "{{.Id}}" "$IMAGE")
        [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
        docker run -d --name DK -v "$PWD/build-record:/build-record" -v "$PWD/user:$DK_USER" -v "$PWD/openwrt_bin:$DK_BIN" -v "$PWD/ghcache:/ghcache" -v "$PWD/scripts:/cache-scripts:ro" -v "$PWD/docker:/builder-context:ro" -v "$PWD/tcarchive:/tcarchive" -v "$PWD/tbarchive:/tbarchive" -v "$PWD/ccarchive:/ccarchive" -v "$PWD/dlarchive:/dlarchive" -v "$PWD/dlcache:/dlcache" "$IMAGE_ID" sleep infinity
        BUILDER_FINGERPRINT=$(docker exec -u 0 DK python3 /cache-scripts/builder_fingerprint.py /builder-context)
        [[ "$BUILDER_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
        echo "BUILDER_FINGERPRINT=$BUILDER_FINGERPRINT" >> "$GITHUB_ENV"
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare source and cache key
      id: inputs
      run: |
        # Variables expand inside the container, not on the runner.
        # shellcheck disable=SC2016
        docker_exec DK bash -e -c '
          . $DK_PROFILE/settings.ini
          [[ $REPO_URL && $REPO_REF ]] || { echo "::error::Missing REPO_URL or REPO_REF"; exit 1; }
          [[ $REPO_REF = latest-release ]] || { echo "::error::REPO_REF must be latest-release"; exit 1; }
          umask 022
          git config --global tar.umask 0022
          mkdir -p $DK_OPENWRT
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          SOURCE_TAG=$(git ls-remote --tags --refs "$REPO_URL" "refs/tags/v*" | awk -F/ "\$3 ~ /^v[0-9]+\\.[0-9]+\\.[0-9]+$/ {print \$3}" | sort -V | tail -1)
          [[ $SOURCE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No stable release tag found"; exit 1; }
          SOURCE_REF="refs/tags/$SOURCE_TAG"
          echo "SOURCE_TAG=$SOURCE_TAG"
          echo "SOURCE_REF=$SOURCE_REF"
          echo "$SOURCE_TAG" > /build-record/source-tag.txt
          git fetch --depth=1 origin "$SOURCE_REF"
          git checkout -f --detach FETCH_HEAD
          git reset --hard FETCH_HEAD
          # Remove ALL builder-preseeded patches, feeds, overlays and ABI files.
          git clean -ffdx
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          ln -s $DK_BIN bin && ln -s /dlcache dl
          cp -f feeds.conf.default feeds.conf
          ./scripts/feeds update -a >/dev/null || { echo "::error::feeds update failed"; exit 1; }
          ./scripts/feeds install -a >/dev/null || { echo "::error::feeds install failed"; exit 1; }
          cp $DK_PROFILE/config.diff .config
          echo "CONFIG_CCACHE_DIR=\"/ghcache\"" >> .config
          cp -r "$DK_PROFILE/files/" .
          # Prepare signed external APKs and device defaults before defconfig.
          bash $DK_PROFILE/custom.sh
          python3 /cache-scripts/check_go.py "$DK_OPENWRT" /usr/lib/go
          # Log actual source/feed revisions after customization; fail on broken Git access.
          revision=$(git rev-parse --verify HEAD)
          printf "Source %s/%s: %s\n" "$REPO_URL" "$REPO_REF" "$revision"
          for feed in feeds/*; do
            [ -e "$feed/.git" ] || continue
            revision=$(git -C "$feed" rev-parse --verify HEAD)
            printf "Feed %s: %s\n" "${feed##*/}" "$revision"
          done
          make defconfig
          python3 /cache-scripts/check_defaults.py .config tmp/.packageinfo "$DK_PROFILE/config.diff"
          # Host LLVM is optional upstream; this lean image does not provide it.
          if grep -qx CONFIG_USE_LLVM_HOST=y .config; then
            echo "::error::Host LLVM selected: builder needs clang, llc, llvm-dis, opt and llvm-strip; review include/bpf.mk" >&2
            exit 1
          fi
        '
        KEY=$(docker_exec DK python3 /cache-scripts/cache.py key "$DK_OPENWRT" /tcarchive "$BUILDER_FINGERPRINT")
        echo "key=tc-v1-mx4200-arm64-$KEY" >> "$GITHUB_OUTPUT"
    - name: Restore toolchain cache
      id: tc
      uses: actions/cache/restore@v6
      with:
        path: tcarchive
        key: ${{ steps.inputs.outputs.key }}
        # No restore-keys: toolchain artifacts must be an exact match.
    - name: Extract toolchain cache
      run: docker_exec DK python3 /cache-scripts/cache.py restore "$DK_OPENWRT" /tcarchive '${{ steps.inputs.outputs.key }}'

    - name: Prepare bootstrap cache key
      id: tb_inputs
      if: steps.tc.outputs.cache-hit != 'true'
      env:
        TOOLCHAIN_KEY: ${{ steps.inputs.outputs.key }}
      run: |
        KEY=$(docker_exec DK python3 /cache-scripts/bootstrap_cache.py key "$DK_OPENWRT" /tbarchive "$BUILDER_FINGERPRINT" "$TOOLCHAIN_KEY")
        [[ "$KEY" =~ ^[0-9a-f]{64}$ ]]
        echo "key=tb-v1-mx4200-arm64-$KEY" >> "$GITHUB_OUTPUT"
    - name: Restore compiler bootstrap
      id: tb
      if: steps.tc.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: tbarchive
        key: ${{ steps.tb_inputs.outputs.key }}
        # Bootstrap is exact too; never restore an arbitrary older tools tree.
    - name: Extract compiler bootstrap
      if: steps.tc.outputs.cache-hit != 'true'
      env:
        BOOTSTRAP_KEY: ${{ steps.tb_inputs.outputs.key }}
      run: docker_exec DK python3 /cache-scripts/bootstrap_cache.py restore "$DK_OPENWRT" /tbarchive "$BOOTSTRAP_KEY"

    - name: Download sources
      run: |
        # Restore host tools before download; keep cold download work for compilation.
        # shellcheck disable=SC2016
        docker_exec DK bash -e -c '
          cd $DK_OPENWRT
          umask 022
          git config --global tar.umask 0022
          make download -j8 || exit 1
        '

    - name: Compile firmware
      env:
        BOOTSTRAP_KEY: ${{ steps.tb_inputs.outputs.key }}
        BOOTSTRAP_RECHECK: ${{ steps.tc.outputs.cache-hit != 'true' }}
        BOOTSTRAP_SAVE: ${{ steps.tc.outputs.cache-hit != 'true' && steps.tb.outputs.cache-hit != 'true' }}
      run: |
        # Variables expand inside the container, not on the runner.
        # shellcheck disable=SC2016
        docker_exec DK env BOOTSTRAP_KEY="${BOOTSTRAP_KEY:-}" BOOTSTRAP_RECHECK="${BOOTSTRAP_RECHECK:-false}" BOOTSTRAP_SAVE="${BOOTSTRAP_SAVE:-false}" bash -e -c '
          cd $DK_OPENWRT
          umask 022
          export FORCE_UNSAFE_CONFIGURE=1 CCACHE_MAXSIZE=3G CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
          CCACHE=staging_dir/host/bin/ccache
          started=$SECONDS
          status=0
          if [ "$BOOTSTRAP_RECHECK" = true ] || [ ! -x "$CCACHE" ]; then
            make tools/ccache/compile -j$(($(nproc) + 1)) || status=$?
          fi
          printf "Build timing: bootstrap=%ss status=%s\n" "$((SECONDS - started))" "$status"
          [ "$status" = 0 ] || exit "$status"
          # Snapshot before world: packages may later write to staging_dir/host.
          if [ "$BOOTSTRAP_SAVE" = true ]; then
            if ! python3 /cache-scripts/bootstrap_cache.py pack "$DK_OPENWRT" /tbarchive "$BOOTSTRAP_KEY"; then
              rm -f /tbarchive/bootstrap.tar.gz /tbarchive/key
              echo "::warning::Bootstrap snapshot unavailable; firmware compilation continues."
            fi
          fi
          $CCACHE -d /ghcache --zero-stats
          trap "$CCACHE -d /ghcache -sz ||:" EXIT
          started=$SECONDS
          status=0
          make -j$(($(nproc) + 1)) || make -j1 V=s || status=$?
          printf "Build timing: world=%ss status=%s\n" "$((SECONDS - started))" "$status"
          exit "$status"
        '

    # Go can add dl/go-mod-cache entries during compilation, after make download.
    - name: Check download cache changes
      id: dl_changed
      run: |
        # Runner owns GITHUB_OUTPUT; sudo only reads container-owned downloads.
        # shellcheck disable=SC2024
        sudo python3 scripts/dlcache.py check dlcache "$RUNNER_TEMP/dlcache-before.json" --restored '${{ steps.dl.outputs.cache-matched-key }}' >> "$GITHUB_OUTPUT"

    - name: Validate and stage firmware
      id: stage
      run: |
        sudo chown -R "$(id -u):$(id -g)" openwrt_bin
        docker_exec DK cat "$DK_OPENWRT/.config" > final.config
        docker_exec DK cat "$DK_OPENWRT/tmp/.packageinfo" > final.packageinfo
        python3 scripts/check_defaults.py final.config final.packageinfo user/default/config.diff
        python3 scripts/release_images.py stage openwrt_bin/targets firmware
        WRT_DATE="$(TZ=Asia/Hong_Kong date +'%y.%m.%d-%H.%M.%S')"
        WRT_REV=$(jq -er '.version_code | capture("^r(?<revision>[0-9]+)-[0-9a-f]+$").revision' openwrt_bin/targets/qualcommax/ipq807x/profiles.json)
        SOURCE_TAG="$(cat build-record/source-tag.txt)"
        [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        SOURCE_VERSION="${SOURCE_TAG#v}"
        SOURCE_URL="https://github.com/immortalwrt/immortalwrt/tree/$SOURCE_TAG"
        VERSION="MX4200-ImmortalWrt-${SOURCE_VERSION}-r${WRT_REV}-${WRT_DATE/-/_}"
        printf '%s\n' "$VERSION" > firmware/version.txt
        printf '%s\n' "$VERSION" > firmware/title.txt
        RELEASE_NOTES="firmware/release-notes.md"
        cat > "$RELEASE_NOTES" <<EOF
        ## Linksys MX4200 系列 ImmortalWrt 固件

        - 源码：[$SOURCE_TAG]($SOURCE_URL)
        - 构建时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S %Z')
        - 机型：Linksys MX4200v1 / MX4200v2，请选择对应硬件版本的镜像。
        - 镜像：\`factory.bin\` 用于从原厂固件刷入，\`sysupgrade.bin\` 用于从已有 ImmortalWrt 升级。
        - 定制：中文 LuCI、Aurora、HomeProxy 及既定网络与无线设置。

        [默认设置与使用说明](https://github.com/yahuisme/mx4200-immortalwrt#默认设置)
        EOF

    # One standard writer: 10 GB repository budget including legacy entries.
    # Count all own generations and unknown/legacy entries on each admission.
    # Save/readback/cleanup precedes the next admission in each writer.
    - name: Prepare build caches
      id: cc_budget
      run: |
        docker_exec DK python3 /cache-scripts/cache.py ccache /ghcache /ccarchive unused
        if [ '${{ steps.tc.outputs.cache-hit }}' != true ]; then
          docker_exec DK python3 /cache-scripts/cache.py toolchain "$DK_OPENWRT" /tcarchive '${{ steps.inputs.outputs.key }}'
        fi
        if [ '${{ steps.dl_changed.outputs.save }}' = true ]; then
          docker_exec DK python3 /cache-scripts/cache.py dl /dlcache /dlarchive unused
        fi
        sudo chown -R "$(id -u):$(id -g)" tcarchive ccarchive dlarchive
        # Retire confirmed rolling compiler generations before admitting toolchain.
        python3 scripts/cache_helper.py admit 'cc-v1-mx4200-arm64.' ccarchive/ccache.tar.gz '${{ steps.gh.outputs.cache-primary-key }}'
    - name: Save compiler cache
      uses: actions/cache/save@v6
      if: steps.cc_budget.outputs.save == 'true' && hashFiles('ccarchive/ccache.tar.gz') != ''
      with: {path: ccarchive, key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - name: Prune old compiler caches
      if: steps.cc_budget.outputs.save == 'true'
      run: python3 scripts/cache_helper.py cleanup 'cc-v1-mx4200-arm64.' '${{ steps.gh.outputs.cache-primary-key }}'
    - name: Check toolchain cache budget
      id: tc_budget
      if: steps.tc.outputs.cache-hit != 'true'
      run: python3 scripts/cache_helper.py admit 'tc-v1-mx4200-arm64-' tcarchive/toolchain.tar.gz '${{ steps.inputs.outputs.key }}'
    - name: Save toolchain cache
      uses: actions/cache/save@v6
      if: steps.tc_budget.outputs.save == 'true' && hashFiles('tcarchive/toolchain.tar.gz') != ''
      with: {path: tcarchive, key: '${{ steps.inputs.outputs.key }}'}
    - name: Prune old toolchain caches
      if: steps.tc_budget.outputs.save == 'true'
      run: python3 scripts/cache_helper.py cleanup 'tc-v1-mx4200-arm64-' '${{ steps.inputs.outputs.key }}'
    - name: Check bootstrap cache budget
      id: tb_budget
      if: steps.tc.outputs.cache-hit != 'true' && steps.tb.outputs.cache-hit != 'true' && hashFiles('tbarchive/bootstrap.tar.gz') != ''
      env:
        BOOTSTRAP_KEY: ${{ steps.tb_inputs.outputs.key }}
      run: |
        sudo chown -R "$(id -u):$(id -g)" tbarchive
        python3 scripts/cache_helper.py admit 'tb-v1-mx4200-arm64-' tbarchive/bootstrap.tar.gz "$BOOTSTRAP_KEY"
    - name: Save compiler bootstrap
      uses: actions/cache/save@v6
      if: steps.tb_budget.outputs.save == 'true' && hashFiles('tbarchive/bootstrap.tar.gz') != ''
      with: {path: tbarchive, key: '${{ steps.tb_inputs.outputs.key }}'}
    - name: Prune old bootstrap caches
      if: steps.tb_budget.outputs.save == 'true'
      env:
        BOOTSTRAP_KEY: ${{ steps.tb_inputs.outputs.key }}
      run: python3 scripts/cache_helper.py cleanup 'tb-v1-mx4200-arm64-' "$BOOTSTRAP_KEY"
    - name: Check download cache budget
      id: dl_budget
      if: steps.dl_changed.outputs.save == 'true'
      run: python3 scripts/cache_helper.py admit 'dl-v1-mx4200-arm64.' dlarchive/dl.tar.gz '${{ steps.dl.outputs.cache-primary-key }}'
    - name: Save download cache
      uses: actions/cache/save@v6
      if: steps.dl_changed.outputs.save == 'true' && steps.dl_budget.outputs.save == 'true' && hashFiles('dlarchive/dl.tar.gz') != ''
      with: {path: dlarchive, key: '${{ steps.dl.outputs.cache-primary-key }}'}
    - name: Prune old download caches
      if: steps.dl_budget.outputs.save == 'true'
      run: python3 scripts/cache_helper.py cleanup 'dl-v1-mx4200-arm64.' '${{ steps.dl.outputs.cache-primary-key }}'

    - name: Collect build record
      id: record
      continue-on-error: true
      if: ${{ always() }}
      run: |
        mkdir -p build-record
        printf 'repository=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\nrunner_os=%s\nrunner_arch=%s\nimage_id=%s\nbuilder_fingerprint=%s\n' \
          "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          "$RUNNER_OS" "$RUNNER_ARCH" "$IMAGE_ID" "$BUILDER_FINGERPRINT" > build-record/environment.txt
        docker_exec DK python3 /cache-scripts/build_record.py "$DK_OPENWRT" /build-record > build-record/collection.log 2>&1 || { cat build-record/collection.log; exit 1; }
        [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ && "$BUILDER_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]

    - name: Upload build record
      id: record_upload
      continue-on-error: true
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: build-record-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-record/
        retention-days: 30
        if-no-files-found: error

    - name: Publish firmware and prune releases
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.stage.outcome == 'success' && steps.record.outcome == 'success' && steps.record_upload.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        # Read-only freshness gate; API errors/malformed replies fail closed.
        # This check and create are NOT atomic: main may advance between them.
        current_main() {
          local head
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha') || return 1
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || return 1
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo '::notice::Obsolete build: skipping release mutations; caches may continue.'
            exit 0
          fi
        }
        current_main
        VERSION="$(cat firmware/version.txt)"
        RELEASE_TITLE="$(cat firmware/title.txt)"
        gh release create "$VERSION" firmware/*.bin --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file firmware/release-notes.md
        python3 scripts/verify_release.py "$VERSION" firmware/*.bin
        # Recheck before pruning, before removing older standard releases.
        current_main
        # Include legacy underscore-tagged releases so one release remains after migration.
        RELEASE_PATTERN="^(MX4200-ImmortalWrt-|MX4200_ImmortalWrt_)"
        # Keep only the current release; older production releases are removed.
        if releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100") &&
          old_tags=$(jq -er --arg current "$VERSION" --arg pattern "$RELEASE_PATTERN" '
            flatten | map(select(.draft == false and .prerelease == false and
              (.tag_name | test($pattern)))) |
            if any(.tag_name == $current) then
              [.[] | select(.tag_name != $current)] | map(.tag_name) | join("\n")
            else error("Published release missing from inventory") end
          ' <<< "$releases"); then
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --cleanup-tag -y || echo "::warning::Failed to delete release $tag"
          done <<< "$old_tags"
        else
          echo "::warning::Release inventory unavailable; retaining all releases"
        fi
